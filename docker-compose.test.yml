version: "3"
services:
  web:
    build:
      context: "."
    command: gunicorn -b 0.0.0.0:8000 -w 4 -k uvicorn.workers.UvicornWorker --log-level info app.main:app
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql://csi:csi@ess-notify-postgres/ess-notify
      ALLOWED_NETWORKS: ""
      ADMIN_USERS: "testuser_001"
      SECRET_KEY: "test-secret-key-for-load-testing-only"
      APNS_KEY_ID: "UB40ZXKCDZ"
      TEAM_ID: "6F44JJ9SDF"
      APNS_AUTH_KEY: |
        -----BEGIN PRIVATE KEY-----
        MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQgtAParbMemenK/+8T
        JYWanX1jzKaFcgmupVALPHyaKKKhRANCAARVmMAXI+WPS/vjIsFBHb3B5dQKqgT8
        ytZPnlbWNLGGR7tKdB1eLzyBlIVFe9El4Wlvs19ACPRMtE7l75IlbOT+
        -----END PRIVATE KEY-----
      APPLE_SERVER: "localhost"
      FIREBASE_PROJECT_ID: "test-project"
      GOOGLE_APPLICATION_CREDENTIALS: "/app/test-key.json"
      SENTRY_DSN: ""
      OIDC_ENABLED: "false"
      # Set to true to see all SQL queries
      # SQLALCHEMY_DEBUG: "true"
    ports:
      - "8000:8000"
    volumes:
      - ".:/app"

  postgres:
    volumes:
      - test-pgdata:/var/lib/postgresql/data/pgdata

  seed:
    build:
      context: "."
    command: sh -c "alembic upgrade head && python scripts/seed_db.py --clear --num-users 50 --num-services 10 --num-notifications 500 --output-tokens scripts/test_tokens.json"
    environment:
      SQLALCHEMY_DATABASE_URL: postgresql://csi:csi@ess-notify-postgres/ess-notify
      SECRET_KEY: "test-secret-key-for-load-testing-only"
      GOOGLE_APPLICATION_CREDENTIALS: "/app/test-key.json"
    volumes:
      - ".:/app"
    depends_on:
      - postgres

  locust:
    image: locustio/locust:latest
    ports:
      - "8089:8089"
    volumes:
      - "./tests/performance:/mnt/locust"
      - "./scripts:/mnt/scripts"
    environment:
      TOKEN_FILE: /mnt/scripts/test_tokens.json
    command: -f /mnt/locust/locustfile.py --host http://web:8000
    depends_on:
      - web

volumes:
  test-pgdata:
